<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Gastos | Soporte</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1565c0;
      --gold: #d69b00;
      --ink: #203040;
      --muted: #687683;
      --card: #ffffff;
      --bg: #fffdf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      max-width: 520px;
      width: 100%;
      padding: 44px 36px;
      border: 1px solid #ebe4d2;
      border-radius: 22px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 8px 26px rgba(32, 48, 64, 0.08);
    }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: var(--blue);
      color: white;
      font-size: 30px;
      font-weight: bold;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p {
      margin: 0 auto 26px;
      line-height: 1.5;
      color: var(--muted);
    }
    a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    small {
      display: block;
      margin-top: 30px;
      color: var(--muted);
    }
    .premium { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <div class="mark">$</div>
    <h1>Control de Gastos</h1>
    <p>Administra tus gastos e ingresos de forma sencilla. Para soporte o consultas sobre la aplicacion, escribenos.</p>
    <a href="mailto:controldegastosoficial@gmail.com">Contactar soporte</a>
    <small><span class="premium">Control de Gastos</span> - Freddy Herrera</small>
  </main>
</body>
</html>
